<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Greenhouse embed application</title>
  </head>
  <body>
    <!-- Reduced from https://boards.greenhouse.io/embed/job_app?for=anthropic&token=5238460008
         which serves the same job-boards form as the inline job page. -->
    <form method="get" action="/embed/job_app?for=anthropic&amp;token=5238460008" id="application-form" class="application--form">
      <label id="first_name-label" for="first_name">First Name</label>
      <input id="first_name" class="input input__single-line" type="text" />
      <label id="last_name-label" for="last_name">Last Name</label>
      <input id="last_name" class="input input__single-line" type="text" />
      <label id="email-label" for="email">Email</label>
      <input id="email" class="input input__single-line" type="text" />
      <label id="phone-label" for="phone">Phone</label>
      <input id="phone" class="input input__single-line" type="tel" />
      <label id="upload-label-resume" for="resume">Resume</label>
      <input id="resume" class="visually-hidden" type="file" />
    </form>
  </body>
</html>
