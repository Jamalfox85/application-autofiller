<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Enter Your Password</title>
  </head>
  <body>
    <!-- Auth0 Universal Login password step at login.icims.com/u/login/password.
         The identifier document is a separate page. Same hidden password decoy
         Auth0 renders on the identifier step, then the visible password field.
         Button copy follows Auth0's login-password prompt ("Continue"). -->
    <main class="_widget login-password">
      <header>
        <h1>Enter Your Password</h1>
        <p>Enter your password for Enterprise Mobility to continue to iCIMS.</p>
        <p>icims@example.com <a href="/u/login/identifier?state=fixture-state">Edit</a></p>
      </header>
      <form method="POST" data-form-primary="true" novalidate>
        <input type="hidden" name="state" value="fixture-state" />
        <input class="hide" hidden type="password" autocomplete="off" tabindex="-1" aria-hidden="true" />
        <div class="ulp-field">
          <label id="password-label" for="password">
            Password
            <span class="required" aria-hidden="true">*</span>
          </label>
          <input
            class="input"
            id="password"
            name="password"
            type="password"
            aria-labelledby="password-label"
            aria-required="true"
            required
            autocomplete="current-password"
            autocapitalize="none"
            spellcheck="false"
            value=""
          />
          <button type="button" data-action="toggle" aria-label="Show password">Show password</button>
        </div>
        <p><a href="/u/login/password-reset?state=fixture-state">Forgot password?</a></p>
        <div>
          <button type="submit" name="action" value="default" data-action-button-primary="true" class="_button-login-password">
            Continue
          </button>
        </div>
      </form>
    </main>
  </body>
</html>
