<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>iCIMS candidate</title>
  </head>
  <body>
    <form id="profile">
      <label for="first">First name</label>
      <input id="first" name="PortalProfileFields.FirstName" type="text" />
      <label for="last">Last name</label>
      <input id="last" name="PortalProfileFields.LastName" type="text" />
      <label for="email">Email</label>
      <input id="email" name="PortalProfileFields.Email" type="email" />
      <label for="phone">Phone</label>
      <input id="phone" name="PortalProfileFields.Phone" type="tel" />
      <div class="iCIMS_ResumeSection">
        <label for="resume">Resume</label>
        <input id="resume" name="PortalProfileFields.Resume_File" type="file" />
      </div>
    </form>
  </body>
</html>
