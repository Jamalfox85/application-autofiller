<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Login</title>
  </head>
  <body>
    <!-- Reduced from the HealthEdge login iframe (2026-10-10).
         "Enter Your Information" is one email field plus a GDPR checkbox.
         That is fewer than four fillable controls, and it is not #application-form. -->
    <div class="iCIMS_MainWrapper iCIMS_LoginPage">
      <h1 class="iCIMS_Header">Enter Your Information</h1>
      <form id="enterEmailForm" class="iCIMS_SignIn" method="post" action="/jobs/8287/software-engineer---performance-and-tools/login?step=email&amp;in_iframe=1">
        <label for="email">Email</label>
        <input type="email" autocomplete="email" id="email" name="css_loginName" class="form-control" value="" />
        <input type="checkbox" id="accept_gdpr" name="accept_gdpr" />
        <input type="hidden" name="token" value="1" />
        <input type="submit" id="enterEmailSubmitButton" value="Next" />
      </form>
    </div>
  </body>
</html>
