<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Software Engineer, Developer Platform @ Notion</title>
    <!-- Reduced from https://jobs.ashbyhq.com/notion/1fc309c8-da20-4ff2-84c7-8b863ece2b0a/application
         Inputs render without a form element. The posting stays in JSON-LD.
         Field descriptions are not the job description. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org/",
        "@type": "JobPosting",
        "title": "Software Engineer, Developer Platform",
        "description": "<h1>Who We Are</h1><p>Notion is the collaborative workspace.</p><p>Build reliable platform tools.</p>"
      }
    </script>
  </head>
  <body>
    <div class="ashby-application-form-container">
      <p class="ashby-application-form-autofill-input-description">Upload your resume here to autofill key application fields.</p>
      <label for="name">Name</label>
      <input id="name" type="text" />
      <label for="email">Email</label>
      <input id="email" type="email" />
    </div>
  </body>
</html>
