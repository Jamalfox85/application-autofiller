<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Jobs at Anthropic</title>
    <link rel="canonical" href="https://job-boards.greenhouse.io/anthropic" />
  </head>
  <body>
    <!-- Reduced from https://job-boards.greenhouse.io/anthropic (board index, isJobPost: false).
         Search and department filters are fillable controls. There is no application form. -->
    <main class="main">
      <div class="index--content">
        <h1 class="page-header">Open Roles</h1>
        <div class="job-alert">
          <p class="body body--medium">Create a Job Alert</p>
          <button class="link" type="button">Create alert</button>
        </div>
        <div class="index__main">
          <div class="filters">
            <div class="text-input-wrapper">
              <label id="keyword-filter-label" for="keyword-filter">Search</label>
              <input id="keyword-filter" class="input" type="text" placeholder="Search" value="" />
            </div>
            <div class="select">
              <label id="department-filter-label" for="department-filter">Department</label>
              <div class="select__control">
                <input
                  id="department-filter"
                  class="select__input"
                  type="text"
                  role="combobox"
                  aria-autocomplete="list"
                  aria-expanded="false"
                />
              </div>
            </div>
            <div class="select">
              <label id="office-filter-label" for="office-filter">Office</label>
              <div class="select__control">
                <input
                  id="office-filter"
                  class="select__input"
                  type="text"
                  role="combobox"
                  aria-autocomplete="list"
                  aria-expanded="false"
                />
              </div>
            </div>
          </div>
          <h2 data-testid="job-count-header">645 jobs</h2>
          <div class="job-posts">
            <table>
              <tbody>
                <tr class="job-post">
                  <td>
                    <a href="https://job-boards.greenhouse.io/anthropic/jobs/5183044008">
                      <p>Anthropic Fellows Program, AI Safety &amp; Security</p>
                    </a>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
