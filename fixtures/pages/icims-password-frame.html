<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Login</title>
  </head>
  <body>
    <!-- Password step on the same /login URL as the email gate.
         Reduced from the iCIMS login document the dry-run describes
         (email, password, and confirm password). The email step is
         icims-login-frame.html. -->
    <div class="iCIMS_MainWrapper iCIMS_LoginPage">
      <h1 class="iCIMS_Header">Enter Your Information</h1>
      <form id="enterEmailForm" class="iCIMS_SignIn" method="post">
        <label for="email">Email</label>
        <input type="email" autocomplete="email" id="email" name="css_loginName" class="form-control" value="" />
        <label for="password">Password</label>
        <input type="password" autocomplete="new-password" id="password" name="css_loginPassword" class="form-control" value="" />
        <label for="passwordConfirm">Confirm password</label>
        <input type="password" autocomplete="new-password" id="passwordConfirm" name="passwordConfirm" class="form-control" value="" />
        <input type="submit" id="enterEmailSubmitButton" value="Next" />
      </form>
    </div>
  </body>
</html>
