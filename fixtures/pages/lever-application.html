<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lever apply</title>
  </head>
  <body>
    <!-- Reduced from https://jobs.lever.co/wealthfront/4d469c84-f50e-479f-bc29-80b573cd6336/apply -->
    <form id="application-form" enctype="multipart/form-data" method="POST">
      <label for="resume-upload-input">Resume/CV</label>
      <input id="resume-upload-input" name="resume" type="file" />
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" />
      <label for="email">Email</label>
      <input id="email" name="email" type="email" />
      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" />
      <label for="location-input">Current location</label>
      <input id="location-input" name="location" type="text" />
      <label for="org">Current company</label>
      <input id="org" name="org" type="text" />
    </form>
  </body>
</html>
