<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Candidate profile</title>
  </head>
  <body>
    <!-- Later profile step, reduced from the live Kemin create-profile markup
         captured in icimsResumeFile.test.ts (icims_content_iframe,
         /jobs/12279/global-erp-business-analyst/candidate). -->
    <form id="profile" class="iCIMS_ProfileForm">
      <div class="iCIMS_ResumeSection" role="group" aria-labelledby="label_PortalProfileFields.Resume_File">
        <label id="label_PortalProfileFields.Resume_File">Resume</label>
        <input type="file" id="PortalProfileFields.Resume_File" name="PortalProfileFields.Resume_File" aria-required="true" />
      </div>
      <label for="PersonProfileFields.FirstName">First name</label>
      <input id="PersonProfileFields.FirstName" name="PersonProfileFields.FirstName" type="text" value="" />
      <label for="PersonProfileFields.LastName">Last name</label>
      <input id="PersonProfileFields.LastName" name="PersonProfileFields.LastName" type="text" value="" />
      <label for="PersonProfileFields.Email">Email</label>
      <input id="PersonProfileFields.Email" name="PersonProfileFields.Email" type="email" value="" />
      <button type="submit">Submit Profile</button>
    </form>
  </body>
</html>
