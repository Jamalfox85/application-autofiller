<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Greenhouse education school fixture</title>
  </head>
  <body>
    <form id="application-form">
      <div class="education--container">
        <div class="education--form">
          <div class="select" data-catalog="school">
            <label id="school--0-label" for="school--0">School</label>
            <div class="select__control">
              <div class="select__value-container">
                <div class="select__placeholder">Select...</div>
                <input
                  id="school--0"
                  class="select__input"
                  role="combobox"
                  aria-expanded="false"
                  aria-autocomplete="list"
                  value=""
                />
              </div>
              <button type="button" aria-label="Toggle flyout" tabindex="-1"></button>
            </div>
            <div class="select__menu" hidden>
              <div id="react-select-school--0-listbox" role="listbox">No options</div>
            </div>
          </div>

          <div class="select" data-catalog="degree">
            <label id="degree--0-label" for="degree--0">Degree</label>
            <div class="select__control">
              <div class="select__value-container">
                <div class="select__placeholder">Select...</div>
                <input
                  id="degree--0"
                  class="select__input"
                  role="combobox"
                  aria-expanded="false"
                  aria-autocomplete="list"
                  value=""
                />
              </div>
              <button type="button" aria-label="Toggle flyout" tabindex="-1"></button>
            </div>
            <div class="select__menu" hidden>
              <div id="react-select-degree--0-listbox" role="listbox"></div>
            </div>
          </div>

          <div class="select" data-catalog="discipline">
            <label id="discipline--0-label" for="discipline--0">Discipline</label>
            <div class="select__control">
              <div class="select__value-container">
                <div class="select__placeholder">Select...</div>
                <input
                  id="discipline--0"
                  class="select__input"
                  role="combobox"
                  aria-expanded="false"
                  aria-autocomplete="list"
                  value=""
                />
              </div>
              <button type="button" aria-label="Toggle flyout" tabindex="-1"></button>
            </div>
            <div class="select__menu" hidden>
              <div id="react-select-discipline--0-listbox" role="listbox"></div>
            </div>
          </div>
        </div>
      </div>
    </form>
    <script>
      // Mirrors job-board education selects: mouseup on the control opens the menu.
      // Degree and discipline are a static catalog. School is async (debounce), and the
      // menu says "No options" until that search returns. Option clicks are not wired:
      // a query that matches the catalog label still looks filled, and a later typed
      // query is what #school--0 keeps showing when the filler moves on too soon.
      const CATALOGS = {
        school: [
          'Austin College',
          'Stephen F. Austin State University',
          'University of Texas - Austin',
          'University of Texas - Dallas',
        ],
        degree: ["Associate's Degree", "Bachelor's Degree", "Master's Degree"],
        discipline: ['Computer Science', 'Engineering', 'Mathematics'],
      }

      function renderOptions(input, items) {
        const listbox = input.closest('.select').querySelector('[role="listbox"]')
        listbox.innerHTML = ''
        if (!items.length) {
          listbox.textContent = 'No options'
          return
        }
        items.forEach((label, index) => {
          const option = document.createElement('div')
          option.setAttribute('role', 'option')
          option.id = 'react-select-' + input.id + '-option-' + index
          option.textContent = label
          listbox.append(option)
        })
      }

      function openMenu(input) {
        const root = input.closest('.select')
        input.setAttribute('aria-expanded', 'true')
        root.querySelector('.select__menu').hidden = false
      }

      document.querySelectorAll('.select').forEach((root) => {
        const input = root.querySelector('input')
        const kind = root.getAttribute('data-catalog')
        const catalog = CATALOGS[kind]
        root.addEventListener('mouseup', () => {
          if (input.getAttribute('aria-expanded') === 'true') return
          openMenu(input)
          if (kind !== 'school') renderOptions(input, catalog)
        })
        input.addEventListener('input', () => {
          const term = input.value.trim().toLowerCase()
          if (kind !== 'school') {
            renderOptions(
              input,
              catalog.filter((label) => !term || label.toLowerCase().includes(term)),
            )
            return
          }
          renderOptions(input, [])
          window.setTimeout(() => {
            if (!term) {
              renderOptions(input, [])
              return
            }
            renderOptions(
              input,
              catalog.filter((label) => label.toLowerCase().includes(term)),
            )
          }, 500)
        })
      })
    </script>
  </body>
</html>
